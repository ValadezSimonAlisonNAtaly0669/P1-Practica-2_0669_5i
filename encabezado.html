<head> <!--Barra de busqueda-->
    <meta charset="UTF-8"> <!--Etiqueta que permite introducir simbolos, caracteres, de todo tipo y que se muestren-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encabezados HTML</title>  <!--lo que aparecera en la barra de busqueda-->
</head>

<body> <!--Cuerpo-->
    <!-- Encabezados -->
    <!-- Se definen con la etiqueta h, seguido
  del numero correspondiente de tamaño y/o
  importancia -->
    <h1>Titulo 1</h1> <!--Titulo mas importante-->
    <h2>Titulo 2</h2> <!--Subtitulo-->
    <h3>Titulo 3</h3> <!--Titulo de menos importancia-->
    <h4>Titulo 4</h4> <!--Titulo de menos importancia-->
    <h5>Titulo 5</h5> <!--Titulo de menos importancia-->
    <h6>Titulo 6</h6> <!--Titulo sin importancia-->
</body> <!--Cerrar etiqueta de cuerpo-->

</html> <!--Cerrar html-->
